<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750A4">
  <title>Tsuki no Tensha · Dinámicas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="appbar" role="banner">
    <button class="icon-btn" id="mb" aria-label="Abrir menú">
      <span class="material-symbols-outlined">menu</span>
    </button>

    <a class="brand" href="#inicio" aria-label="Tsuki no Tensha · Inicio">
      <span class="brand-mark material-symbols-outlined">nightlight</span>
      <span class="brand-title">Tsuki no Tensha</span>
    </a>

    <div class="search" role="search">
      <span class="material-symbols-outlined search-icon">search</span>
      <input id="search" type="search" placeholder="Buscar herramienta…" aria-label="Buscar herramienta" autocomplete="off">
      <div class="search-results" id="search-results" hidden></div>
    </div>

    <button class="icon-btn" id="th" aria-label="Cambiar tema">
      <span class="material-symbols-outlined" id="th-icon">dark_mode</span>
    </button>
  </header>

  <div class="layout">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sb" role="navigation" aria-label="Navegación principal">
      <nav id="nav"></nav>
    </aside>
    <main class="main" id="main" role="main"></main>
  </div>

  <button class="fab" id="fab" aria-label="Sorpréndeme" title="Sorpréndeme con algo">
    <span class="material-symbols-outlined">shuffle</span>
  </button>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
